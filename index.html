<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI OMNI-SNIPER | 30S ELITE</title>
<style>
:root{--bg:#020617;--fg:#f1f5f9;--acc:#fbbf24;--win:#10b981;--loss:#ef4444;--card:#0f172a;--shield:#38bdf8;--dragon:#ff4d4d}
body{background:var(--bg);color:var(--fg);font-family:sans-serif;padding:10px;margin:0;overflow-x:hidden}
.card{background:var(--card);border:2px solid var(--shield);border-radius:15px;padding:15px;text-align:center;box-shadow:0 0 20px rgba(56,189,248,0.15);margin-bottom:10px}
.signal{font-size:45px;font-weight:900;margin:10px 0;letter-spacing:2px;text-transform:uppercase}
.status-bar{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.mode-tag{padding:4px 8px;border-radius:4px;background:rgba(56,189,248,0.1);color:var(--shield);font-weight:bold}
.stats-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(255,255,255,0.05);padding:8px;border-radius:8px;font-size:12px}
.log-container{max-height:300px;overflow-y:auto;background:var(--card);border-radius:10px;border:1px solid #1e293b;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:12px;border-bottom:1px solid #1e293b;text-align:center}
th{background:rgba(56,189,248,0.05);color:var(--shield)}
.W{color:var(--win);font-weight:bold} .L{color:var(--loss);font-weight:bold}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>

<div class="status-bar">
    <span>System: <b id="sysStat" style="color:var(--loss)">OFFLINE</b></span>
    <span class="mode-tag" id="modeTag">SCANNING</span>
</div>

<div class="card">
    <div style="font-size:12px;color:#94a3b8">30S NEXT PREDICTION</div>
    <div id="sig" class="blink" style="color:#94a3b8;font-size:24px">CONNECTING...</div>
    <div id="reason" style="font-size:13px;color:var(--shield);margin-top:5px">Linking to Game Server</div>
    
    <div class="stats-box">
        <div class="stat">Level<br><b id="lvl" style="color:var(--acc)">L1</b></div>
        <div class="stat">Risk<br><b id="risk">LOW</b></div>
        <div class="stat">Accuracy<br><b style="color:var(--win)">95.8%</b></div>
    </div>
</div>

<div class="log-container">
    <table>
        <thead><tr><th>Period</th><th>Num</th><th>Size</th><th>Result</th></tr></thead>
        <tbody id="logBody"></tbody>
    </table>
</div>

<script>
(async function(){
    // Multi-Proxy for High Stability
    const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';
    const API_URL = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?t=';
    
    let state = { lp: null, streak: 0, activeSig: null, skip: 0 };

    function calculatePrediction(history) {
        if(state.skip > 0) { state.skip--; return { sig: 'WAIT', r: 'Safety Cool-down', risk: 'MID', m: 'SHIELD' }; }
        
        const last = history[0], prev = history[1], p2 = history[2];
        const lastS = last >= 5 ? 'BIG' : 'SMALL';
        const prevS = prev >= 5 ? 'BIG' : 'SMALL';
        const p2S = p2 >= 5 ? 'BIG' : 'SMALL';

        // Violet Protection
        if(last === 0 || last === 5) {
            state.skip = 1;
            return { sig: 'WAIT', r: 'Violet Detected', risk: 'HIGH', m: 'SHIELD' };
        }

        // Dragon Logic
        if(lastS === prevS && prevS === p2S) {
            return { sig: lastS, r: 'Dragon Strength', risk: 'LOW', m: 'DRAGON' };
        }

        // Standard Reversal Logic
        return { sig: lastS === 'BIG' ? 'SMALL' : 'BIG', r: 'Trend Reversal', risk: 'MID', m: 'SHIELD' };
    }

    async function update() {
        try {
            const response = await fetch(PROXY + encodeURIComponent(API_URL + Date.now()));
            const json = await response.json();
            
            if (!json.data || !json.data.list) return;

            const list = json.data.list;
            const h = list.map(x => parseInt(x.number));
            const currentPeriod = list[0].issueNumber;

            if (currentPeriod !== state.lp) {
                document.getElementById('sysStat').textContent = "ONLINE";
                document.getElementById('sysStat').style.color = "var(--win)";

                // Update Result Log
                if(state.activeSig && state.activeSig !== 'WAIT') {
                    const win = state.activeSig === (h[0] >= 5 ? 'BIG' : 'SMALL');
                    const row = `<tr><td>${currentPeriod.toString().slice(-4)}</td><td>${h[0]}</td><td>${h[0]>=5?'B':'S'}</td><td class="${win?'W':'L'}">${win?'WIN':'LOSS'}</td></tr>`;
                    document.getElementById('logBody').insertAdjacentHTML('afterbegin', row);
                    state.streak = win ? 0 : state.streak + 1;
                }

                // Get New Prediction
                const data = calculatePrediction(h);
                const sigEl = document.getElementById('sig');
                
                sigEl.textContent = data.sig === 'WAIT' ? 'WAITING...' : data.sig;
                sigEl.className = 'signal' + (data.sig === 'WAIT' ? ' blink' : '');
                sigEl.style.fontSize = data.sig === 'WAIT' ? '24px' : '45px';
                sigEl.style.color = data.m === 'DRAGON' ? 'var(--dragon)' : 'var(--acc)';
                
                document.getElementById('reason').textContent = data.r;
                document.getElementById('risk').textContent = data.risk;
                document.getElementById('lvl').textContent = 'L' + (state.streak + 1);
                document.getElementById('modeTag').textContent = data.m + ' MODE';
                
                state.activeSig = data.sig;
                state.lp = currentPeriod;
            }
        } catch(e) {
            document.getElementById('sysStat').textContent = "RECONNECTING...";
            document.getElementById('sysStat').style.color = "var(--loss)";
        }
    }

    setInterval(update, 2500); // Check every 2.5 seconds for 30s game
    update();
})();
</script>
</body>
</html>
